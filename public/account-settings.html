<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061421">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | إعدادات الحساب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css?v=34">
  <link rel="stylesheet" href="./css/calm-ui.css?v=4">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto flex min-h-screen w-full max-w-xl items-center px-4 py-8">
    <section class="settings-panel w-full rounded-lg border border-slate-200 bg-white p-6 shadow-xl shadow-emerald-950/5 sm:p-8">
      <p class="text-xs font-bold text-amber-700">الحساب المحلي</p>
      <h1 class="mt-2 font-amiri text-3xl font-bold text-emerald-950">إعدادات الحساب</h1>
      <p id="account-summary" class="mt-2 text-xs leading-6 text-slate-500"></p>
      <div id="account-status" class="mt-5 hidden rounded-xl border px-4 py-3 text-xs leading-6" role="status" aria-live="polite"></div>

      <form id="password-form" class="mt-6 space-y-4" novalidate>
        <div>
          <label for="new-password" class="mb-2 block text-xs font-bold text-slate-700">كلمة المرور الجديدة</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="8" required class="figma-input w-full rounded-xl px-4 py-3 text-sm" placeholder="8 أحرف على الأقل" dir="ltr">
        </div>
        <div>
          <label for="confirm-password" class="mb-2 block text-xs font-bold text-slate-700">تأكيد كلمة المرور</label>
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required class="figma-input w-full rounded-xl px-4 py-3 text-sm" placeholder="أعد كتابة كلمة المرور" dir="ltr">
        </div>
        <button id="save-password-btn" type="submit" class="btn-figma-gold w-full rounded-xl py-3 text-sm">حفظ كلمة المرور</button>
      </form>

      <p class="mt-6 border-t border-slate-100 pt-5 text-center text-xs leading-6 text-slate-500">عند فقدان كلمة المرور، راجع إدارة المركز لتعيين كلمة مؤقتة آمنة.</p>
      <button id="back-btn" type="button" class="mt-4 w-full text-xs font-bold text-slate-500 hover:text-emerald-800">العودة إلى اللوحة</button>
    </section>
  </main>
  <script type="module" src="./js/pages/account-settings.js"></script>
</body>
</html>
