<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | تفاصيل الفصل والدروس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/design-system.css?v=3">
  <link rel="stylesheet" href="/css/teacher-workspace.css?v=2">
  <link rel="stylesheet" href="/css/calm-ui.css?v=3">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col teacher-unified-shell" data-teacher-section="circles">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="/teacher/classrooms.html" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-xs transition">➔ الفصول الافتراضية</a>
        <div>
          <h1 id="classroom-title" class="font-amiri text-2xl font-bold tracking-wide text-amber-300">...</h1>
          <p class="text-xs text-emerald-100 font-light">نشر الدروس وجلسات البث والاختبارات</p>
        </div>
      </div>

      <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-bold">خروج</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Right: Lessons & Live Sessions (2 Cols) -->
      <div class="lg:col-span-2 space-y-8">
        
        <!-- Form to Publish Lesson -->
        <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
          <h3 class="font-amiri text-2xl font-bold text-emerald-950 mb-4 border-b pb-2">نشر درس جديد / إضافة جلسة مباشر</h3>

          <form id="publish-lesson-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">عنوان الدرس</label>
              <input type="text" id="lesson-title" required placeholder="مثال: أحكام أحكام الطهارة والصلاة - الجزء الأول"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">محتوى الدرس والشرح النصي</label>
              <textarea id="lesson-content" rows="4" placeholder="اكتب تفاصيل الدرس والواجبات والملاحظات المطلوبة هنا..."
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white"></textarea>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">رابط اجتماع Google Meet (اختياري)</label>
              <input type="url" id="lesson-meet-link" placeholder="https://meet.google.com/abc-defg-hij"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
            </div>

            <button type="submit" class="btn-emerald px-8 py-3 rounded-xl font-bold text-sm">
              نشر الدرس فوراً
            </button>
          </form>
        </div>

        <section class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b pb-3 mb-4">
            <div>
              <h3 class="font-amiri text-2xl font-bold text-emerald-950">إنشاء واجب</h3>
              <p class="text-xs text-gray-500">حدّد المطلوب ونوع التسليم والموعد النهائي.</p>
            </div>
            <a href="/teacher/grading.html" class="btn-gold px-4 py-2 rounded-xl text-xs font-bold">تصحيح التسليمات</a>
          </div>

          <form id="create-assignment-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-2">
              <label for="assignment-title" class="block text-xs font-bold text-gray-700 mb-1">عنوان الواجب</label>
              <input type="text" id="assignment-title" required maxlength="200" placeholder="مثال: تلخيص أحكام الطهارة"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
            </div>
            <div class="md:col-span-2">
              <label for="assignment-description" class="block text-xs font-bold text-gray-700 mb-1">التعليمات</label>
              <textarea id="assignment-description" rows="3" maxlength="5000" placeholder="اكتب تفاصيل المطلوب ومعايير التسليم..."
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white"></textarea>
            </div>
            <div>
              <label for="assignment-submission-type" class="block text-xs font-bold text-gray-700 mb-1">طريقة التسليم</label>
              <select id="assignment-submission-type" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm bg-white outline-none">
                <option value="text">إجابة نصية</option>
                <option value="file">رفع ملف</option>
              </select>
            </div>
            <div>
              <label for="assignment-due-date" class="block text-xs font-bold text-gray-700 mb-1">آخر موعد للتسليم</label>
              <input type="datetime-local" id="assignment-due-date" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm bg-white outline-none">
            </div>
            <div class="md:col-span-2">
              <button type="submit" id="create-assignment-btn" class="btn-emerald px-8 py-3 rounded-xl font-bold text-sm">نشر الواجب للطلاب</button>
            </div>
          </form>
        </section>

        <section class="space-y-4">
          <div class="flex items-center justify-between gap-3 border-b pb-2">
            <h3 class="font-amiri text-2xl font-bold text-emerald-950">واجبات الفصل</h3>
            <span id="assignments-count" class="text-xs font-bold text-amber-800">0 واجب</span>
          </div>
          <div id="assignments-list" class="space-y-3"></div>
        </section>

        <!-- Lessons Stream -->
        <div class="space-y-4">
          <h3 class="font-amiri text-2xl font-bold text-emerald-950 border-b pb-2">الدروس المنشورة في الفصل</h3>
          <div id="lessons-list" class="space-y-4">
            <!-- Loaded dynamically -->
          </div>
        </div>

      </div>

      <!-- Left Sidebar: Classroom Students & Quizzes (1 Col) -->
      <div class="space-y-6">
        
        <!-- Classroom Students -->
        <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
          <h3 class="font-amiri text-xl font-bold text-emerald-950 mb-3 border-b pb-2">طلاب الفصل</h3>
          
          <div class="flex space-x-2 space-x-reverse mb-4">
            <select id="available-students-select" class="w-full px-3 py-2 rounded-xl border text-xs bg-white outline-none">
              <!-- Loaded dynamically -->
            </select>
            <button id="add-student-btn" class="btn-emerald text-xs px-3 py-2 rounded-xl font-bold whitespace-nowrap">
              إضافة
            </button>
          </div>

          <div id="classroom-students-list" class="space-y-2 max-h-48 overflow-y-auto">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Quizzes Box -->
        <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
          <div class="flex items-center justify-between border-b pb-2 mb-3">
            <h3 class="font-amiri text-xl font-bold text-emerald-950">الاختبارات القصيرة</h3>
            <a id="new-quiz-link" href="#" class="btn-gold text-[11px] px-3 py-1.5 rounded-lg font-bold">+ اختبار جديد</a>
          </div>

          <div id="quizzes-list">
            <!-- Loaded dynamically -->
          </div>
        </div>

      </div>

    </div>

  </main>

  <script type="module" src="/js/lib/teacher-shell.js?v=2"></script>
  <script type="module" src="/js/pages/teacher-classroom-detail.js"></script>
</body>
</html>
