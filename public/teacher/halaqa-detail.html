<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | تفاصيل الحلقة وتعيين المقررات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/design-system.css?v=2">
  <link rel="stylesheet" href="/css/teacher-workspace.css?v=2">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col teacher-unified-shell" data-teacher-section="circles">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="/teacher/halaqat.html" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-xs transition">➔ الرجوع للحلقات</a>
        <div>
          <h1 id="halaqa-title" class="font-amiri text-2xl font-bold tracking-wide text-amber-300">...</h1>
          <p class="text-xs text-emerald-100 font-light">إدارة طلاب الحلقة والمقررات اليومية</p>
        </div>
      </div>

      <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-bold">خروج</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <div class="flex justify-end">
      <a id="open-task-center" href="/teacher/tasks.html" class="btn-gold px-5 py-2.5 rounded-lg text-xs font-bold">فتح مركز المهام المتقدم</a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Right: Assign Daily Course (2 Cols) -->
      <div class="lg:col-span-2 space-y-8">
        <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
          <h3 class="font-amiri text-2xl font-bold text-emerald-950 mb-4 border-b pb-2">تعيين مقرر حفظ / مراجعة جديد</h3>

          <form id="assignment-form" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">عنوان المهمة</label>
              <input type="text" id="assignment-title" required maxlength="160" placeholder="مثال: الحفظ الجديد" class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm outline-none">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">نوع التعيين</label>
                <select id="assign-target" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm outline-none">
                  <option value="collective">تعيين جماعي (كل طلاب الحلقة)</option>
                  <option value="individual">تعيين فردي (طالب محدد)</option>
                </select>
              </div>

              <div id="student-select-container" class="hidden">
                <label class="block text-xs font-bold text-gray-700 mb-1">اختر الطالب</label>
                <select id="target-student-id" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm outline-none">
                  <!-- Filled dynamically -->
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">نوع المقرر</label>
                <select id="assignment-type" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm outline-none">
                  <option value="hifz">حفظ جديد</option>
                  <option value="murajaa">مراجعة</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">التاريخ المستهدف</label>
                <input type="date" id="assignment-date" required class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm outline-none">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">تفاصيل ومحتوى المقرر</label>
              <textarea id="assignment-content" required rows="3" placeholder="مثال: سورة البقرة من الآية 1 إلى الآية 15 مع التجويد..."
                class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none"></textarea>
            </div>

            <button type="submit" class="btn-emerald px-8 py-3 rounded-xl font-bold text-sm">
              إسناد المقرر الآن
            </button>
          </form>
        </div>

        <!-- Recent Assignments List -->
        <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
          <h3 class="font-amiri text-2xl font-bold text-emerald-950 mb-4 border-b pb-2">آخر المقررات اليومية المسندة</h3>
          <div id="recent-assignments-list">
            <!-- Loaded dynamically -->
          </div>
        </div>
      </div>

      <!-- Left: Manage Students List (1 Col) -->
      <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md flex flex-col justify-between">
        <div>
          <h3 class="font-amiri text-2xl font-bold text-emerald-950 mb-4 border-b pb-2">طلاب الحلقة</h3>

          <!-- Add Student Box -->
          <div class="mb-6 bg-emerald-50/50 p-4 rounded-xl border border-emerald-200">
            <label class="block text-xs font-bold text-emerald-900 mb-1">إضافة طالب مفعّل للحلقة</label>
            <div class="flex space-x-2 space-x-reverse mt-2">
              <select id="all-students-select" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-xs outline-none">
                <!-- Loaded dynamically -->
              </select>
              <button id="add-student-btn" class="btn-emerald text-xs px-4 py-2 rounded-xl font-bold whitespace-nowrap">
                إضافة
              </button>
            </div>
          </div>

          <div id="students-list" class="space-y-3 max-h-96 overflow-y-auto">
            <!-- Loaded dynamically -->
          </div>
        </div>
      </div>

    </div>

  </main>

  <script type="module">
    // Set default date to today
    document.getElementById('assignment-date').valueAsDate = new Date();
  </script>
  <script type="module" src="/js/lib/teacher-shell.js?v=1"></script>
  <script type="module" src="/js/pages/teacher-halaqa-detail.js"></script>
</body>
</html>
