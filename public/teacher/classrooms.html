<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | الفصول الافتراضية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=34">
  <link rel="stylesheet" href="/css/design-system.css?v=3">
  <link rel="stylesheet" href="/css/teacher-workspace.css?v=36">
  <link rel="stylesheet" href="/css/calm-ui.css?v=3">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col teacher-unified-shell" data-teacher-section="circles">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="/teacher/halaqat.html" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-xs transition">➔ الرجوع للحلقات</a>
        <div>
          <h1 class="font-amiri text-2xl font-bold tracking-wide text-amber-300">الفصول الافتراضية (Google Classroom Style)</h1>
          <p class="text-xs text-emerald-100 font-light">تدريس الفقه والعقيدة والسيرة النبوية</p>
        </div>
      </div>

      <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-bold">خروج</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <!-- Create Classroom Form -->
    <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
      <form id="create-classroom-form" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">المادة الشرعية</label>
          <select id="subject-select" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
            <!-- Loaded dynamically -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">اسم الفصل الافتراضي</label>
          <input type="text" id="classroom-name" required placeholder="مثال: فقه العبادات - المستوى الأول"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
        </div>

        <button type="submit" class="btn-emerald px-8 py-3 rounded-xl font-bold text-sm">
          + إنشاء فصل جديد
        </button>
      </form>
    </div>

    <!-- Classrooms Grid -->
    <div id="classrooms-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Loaded dynamically -->
    </div>

  </main>

  <script type="module" src="/js/lib/teacher-shell.js?v=3"></script>
  <script type="module" src="/js/pages/teacher-classrooms.js?v=4"></script>
</body>
</html>
