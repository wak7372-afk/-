<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | الدردشة الداخلية (المعلم)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=34">
  <link rel="stylesheet" href="/css/design-system.css?v=3">
  <link rel="stylesheet" href="/css/teacher-workspace.css?v=36">
  <link rel="stylesheet" href="/css/calm-ui.css?v=4">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col teacher-unified-shell" data-teacher-section="messages">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="/teacher/halaqat.html" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-xs transition">➔ الرجوع للحلقات</a>
        <h1 class="font-amiri text-2xl font-bold tracking-wide text-amber-300">الدردشة المباشرة مع الطلاب</h1>
      </div>
      <span id="user-name" class="text-xs font-bold text-amber-300 bg-emerald-950/40 px-3 py-1.5 rounded-xl border border-amber-400/30">...</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

    <div class="glass-card rounded-2xl border border-amber-400/30 shadow-xl grid grid-cols-1 md:grid-cols-4 h-[75vh] overflow-hidden">
      
      <!-- Sidebar Contacts (1 Col) -->
      <div class="border-l border-gray-200 p-4 bg-white/60 flex flex-col">
        <h3 class="font-amiri text-xl font-bold text-emerald-950 mb-3 border-b pb-2">طلاب الحلقة</h3>
        <div id="contacts-list" class="flex-grow overflow-y-auto">
          <!-- Loaded dynamically -->
        </div>
      </div>

      <!-- Main Chat Area (3 Cols) -->
      <div id="chat-window" class="md:col-span-3 flex flex-col bg-slate-50/50">
        
        <!-- Header -->
        <div class="p-4 bg-white border-b flex items-center justify-between shadow-sm">
          <h4 id="active-recipient-name" class="font-bold text-emerald-950 text-base">...</h4>
          <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full">تحديث متزامن Realtime</span>
        </div>

        <!-- Messages Box -->
        <div id="messages-box" class="flex-grow p-6 overflow-y-auto space-y-3">
          <!-- Messages dynamically loaded -->
        </div>

        <!-- Input Bar -->
        <form id="send-msg-form" class="p-4 bg-white border-t flex items-center space-x-3 space-x-reverse">
          <input type="text" id="msg-input" required placeholder="اكتب استفسارك أو الملاحظة هنا..."
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm outline-none bg-slate-50">
          <button type="submit" class="btn-emerald px-6 py-3 rounded-xl font-bold text-sm whitespace-nowrap">
            إرسال
          </button>
        </form>

      </div>

    </div>

  </main>

  <script type="module" src="/js/lib/teacher-shell.js?v=3"></script>
  <script type="module" src="/js/pages/chat.js?v=3"></script>
</body>
</html>
