<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة ذات خيل | حلقات التحفيظ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center font-bold text-emerald-950 text-xl border-2 border-amber-300 shadow">
          ذ
        </div>
        <div>
          <h1 class="font-amiri text-2xl font-bold tracking-wide text-amber-300">حلقات القرآن الكريم</h1>
          <p class="text-xs text-emerald-100 font-light">المعلم: <span id="teacher-name">...</span></p>
        </div>
      </div>

      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="/teacher/tasks.html" class="bg-amber-400 hover:bg-amber-300 text-emerald-950 font-bold text-xs px-3 py-2 rounded-xl transition shadow">مركز المهام</a>
        <a href="/teacher/classrooms.html" class="hover:text-amber-300 text-sm font-semibold transition px-3 py-1.5">الفصول الافتراضية</a>
        <a href="/teacher/grading.html" class="hover:text-amber-300 text-sm font-semibold transition px-3 py-1.5">التصحيح</a>
        <a href="/teacher/attendance.html" class="hover:text-amber-300 text-sm font-semibold transition px-3 py-1.5">الحضور والغياب</a>
        <a href="/teacher/ai-assistant.html" class="hover:text-amber-300 text-sm font-semibold transition px-3 py-1.5">المساعد الذكي</a>
        <a href="/account-settings.html" class="hover:text-amber-300 text-sm font-semibold transition px-3 py-1.5">حسابي</a>
        <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-xl transition font-bold shadow">خروج</button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
    
    <div class="flex items-center justify-between border-b pb-4">
      <div>
        <h2 class="font-amiri text-3xl font-bold text-emerald-950">حلقاتي القرأنية</h2>
        <p class="text-sm text-gray-600">إدارة الحلقات والطلاب وتعيين مقررات الحفظ والمراجعة اليومية</p>
      </div>
    </div>

    <!-- Create Halaqa Bar -->
    <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
      <form id="create-halaqa-form" class="flex flex-col md:flex-row items-center gap-4">
        <div class="flex-grow w-full">
          <label class="block text-xs font-bold text-gray-700 mb-1">اسم الحلقة الجديدة</label>
          <input type="text" id="halaqa-name" required placeholder="مثال: حلقة الإتقان، حلقة التبرعم، حلقة الفجر"
            class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-700 outline-none text-sm bg-white/90">
        </div>
        <button type="submit" class="w-full md:w-auto btn-emerald px-8 py-3 rounded-xl font-bold text-sm whitespace-nowrap self-end">
          + إنشاء حلقة جديدة
        </button>
      </form>
    </div>

    <!-- Halaqat Grid -->
    <div id="halaqat-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Loaded dynamically -->
    </div>

  </main>

  <script type="module" src="/js/pages/teacher-halaqat.js?v=4"></script>
</body>
</html>
