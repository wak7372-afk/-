<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | سجل الحضور والغياب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="/teacher/halaqat.html" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-xs transition">➔ الرجوع للحلقات</a>
        <div>
          <h1 class="font-amiri text-2xl font-bold tracking-wide text-amber-300">سجل الحضور والغياب</h1>
        </div>
      </div>
      <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-bold">خروج</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <div class="glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">اختر الحلقة / الفصل</label>
          <select id="session-select" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
            <!-- Loaded dynamically -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">التاريخ</label>
          <input type="date" id="date-input" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm outline-none bg-white">
        </div>

        <button type="button" id="load-students-btn" class="btn-emerald px-6 py-2.5 rounded-xl font-bold text-sm">
          عرض قائمة الطلاب
        </button>
      </div>
    </div>

    <!-- Attendance Form -->
    <div id="attendance-table-container" class="hidden glass-card rounded-2xl p-6 border border-amber-400/30 shadow-md space-y-6">
      <form id="save-attendance-form" class="space-y-6">
        <div class="overflow-x-auto">
          <table class="w-full text-right border-collapse">
            <thead>
              <tr class="bg-emerald-900/5 text-emerald-900 text-xs font-bold border-b">
                <th class="py-3 px-4">اسم الطالب</th>
                <th class="py-3 px-4">حاضر</th>
                <th class="py-3 px-4">غائب</th>
                <th class="py-3 px-4">معذور</th>
              </tr>
            </thead>
            <tbody id="attendance-table-body">
              <!-- Loaded dynamically -->
            </tbody>
          </table>
        </div>

        <button type="submit" class="btn-emerald px-8 py-3 rounded-xl font-bold text-sm shadow">
          حفظ سجل الحضور والغياب
        </button>
      </form>
    </div>

  </main>

  <script type="module" src="/js/pages/teacher-attendance.js"></script>
</body>
</html>
