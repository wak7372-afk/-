<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز ذات خيل لتعليم القرآن الكريم وعلومه | إنشاء/تعديل اختبار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=34">
  <link rel="stylesheet" href="/css/design-system.css?v=3">
  <link rel="stylesheet" href="/css/teacher-workspace.css?v=36">
  <link rel="stylesheet" href="/css/calm-ui.css?v=3">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col teacher-unified-shell" data-teacher-section="circles">

  <!-- Navbar -->
  <header class="bg-emerald-gold-gradient text-white shadow-lg py-4 px-6 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <a href="javascript:history.back()" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-xs transition">➔ رجوع</a>
        <h1 class="font-amiri text-2xl font-bold tracking-wide text-amber-300">محرر الاختبارات القصيرة</h1>
      </div>
      <button id="logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-xl font-bold">خروج</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

    <div class="glass-card rounded-2xl p-8 border border-amber-400/30 shadow-xl">
      <form id="save-quiz-form" class="space-y-6">
        
        <div>
          <label class="block text-sm font-bold text-emerald-950 mb-1">عنوان الاختبار</label>
          <input type="text" id="quiz-title-input" required placeholder="مثال: اختبار الوحدة الأولى في الفقه"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-base font-semibold outline-none bg-white">
        </div>

        <div id="questions-editor-container" class="space-y-6">
          <!-- Loaded dynamically -->
        </div>

        <div class="flex items-center justify-between pt-4 border-t">
          <button type="button" id="add-question-btn" class="btn-gold px-6 py-2.5 rounded-xl font-bold text-xs">
            + إضافة سؤال جديد
          </button>
          
          <button type="submit" class="btn-emerald px-8 py-3 rounded-xl font-bold text-sm">
            حفظ ونشر الاختبار
          </button>
        </div>
      </form>
    </div>

  </main>

  <script type="module" src="/js/lib/teacher-shell.js?v=3"></script>
  <script type="module" src="/js/pages/teacher-quiz-editor.js"></script>
</body>
</html>
