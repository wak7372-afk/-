<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061421">
  <title>منصة ذات خيل | استعادة كلمة المرور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="figma-green-pattern-bg flex min-h-screen items-center justify-center p-5">
  <main class="settings-panel w-full max-w-md rounded-lg border border-white/30 bg-white p-6 shadow-2xl sm:p-8">
    <p class="text-xs font-bold text-amber-700">استعادة الحساب المحلي</p>
    <h1 class="mt-2 font-amiri text-3xl font-bold text-emerald-950">إعادة ضبط كلمة المرور</h1>
    <p class="mt-2 text-xs leading-6 text-slate-500">سنرسل رمز تحقق إلى البريد المرتبط بحساب Google الموثوق، ثم يمكنك اختيار كلمة مرور جديدة.</p>
    <div id="reset-status" class="mt-5 hidden rounded-xl border px-4 py-3 text-xs leading-6" role="status" aria-live="polite"></div>

    <form id="recovery-request-form" class="mt-6 space-y-4" novalidate>
      <div>
        <label for="recovery-username" class="mb-2 block text-xs font-bold text-slate-700">اسم المستخدم</label>
        <input id="recovery-username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" required class="figma-input w-full rounded-xl px-4 py-3 text-sm" placeholder="ahmed.ali" dir="ltr">
      </div>
      <button id="request-otp-button" type="submit" class="btn-figma-gold w-full rounded-xl py-3 text-sm">إرسال رمز التحقق</button>
    </form>

    <form id="otp-recovery-form" class="mt-6 hidden space-y-4" novalidate>
      <p id="otp-destination" class="rounded-lg border border-emerald-100 bg-emerald-50 px-3 py-2 text-xs leading-6 text-emerald-800"></p>
      <div>
        <label for="recovery-otp" class="mb-2 block text-xs font-bold text-slate-700">رمز التحقق</label>
        <input id="recovery-otp" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" required class="figma-input w-full rounded-xl px-4 py-3 text-center text-lg tracking-[0.35em]" placeholder="000000" dir="ltr">
      </div>
      <div>
        <label for="reset-new-password" class="mb-2 block text-xs font-bold text-slate-700">كلمة المرور الجديدة</label>
        <input id="reset-new-password" type="password" autocomplete="new-password" minlength="8" required class="figma-input w-full rounded-xl px-4 py-3 text-sm" dir="ltr">
      </div>
      <div>
        <label for="reset-confirm-password" class="mb-2 block text-xs font-bold text-slate-700">تأكيد كلمة المرور</label>
        <input id="reset-confirm-password" type="password" autocomplete="new-password" minlength="8" required class="figma-input w-full rounded-xl px-4 py-3 text-sm" dir="ltr">
      </div>
      <button id="verify-otp-button" type="submit" class="btn-figma-gold w-full rounded-xl py-3 text-sm">تأكيد الرمز وتحديث كلمة المرور</button>
      <button id="resend-otp-button" type="button" class="w-full rounded-xl border border-emerald-700 px-4 py-3 text-xs font-bold text-emerald-800 transition hover:bg-emerald-50">إرسال رمز جديد</button>
    </form>

    <a href="./index.html" class="mt-6 block text-center text-xs font-bold text-emerald-800 hover:underline">العودة إلى تسجيل الدخول</a>
  </main>
  <script type="module" src="./js/pages/reset-password.js"></script>
</body>
</html>
